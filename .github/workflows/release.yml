name: Release APK

# Trigger 1 — manual dispatch from the Actions tab (choose version)
# Trigger 2 — pushing a tag like  v1.2.3
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name  (e.g. 1.2.0) — just a label, does not need to be unique'
        required: true
        default: '1.1.1'
      version_code:
        description: 'Version code — integer, MUST be higher than pubspec.yaml''s current build number AND every version Play Console has ever accepted. This is the field Play actually enforces; version_name above is cosmetic.'
        required: true
        default: '201'
      unlock_all_features:
        description: 'Unlock every paid feature with no purchase (Closed Testing builds only — NEVER for Production)'
        type: boolean
        required: true
        default: false
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Java ──────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ── Flutter ───────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ── Dependencies ──────────────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── Resolve version ───────────────────────────────────────────────
      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
            CODE=$(git rev-list --count HEAD)
            # Tag pushes are the "real release" path — never unlock features
            # here even if a future workflow_dispatch build left the input
            # checked; only workflow_dispatch's own explicit input can do it.
            UNLOCK="false"
          else
            NAME="${{ github.event.inputs.version_name }}"
            CODE="${{ github.event.inputs.version_code }}"
            UNLOCK="${{ github.event.inputs.unlock_all_features }}"

            # Guard against the exact mistake that has bitten this project
            # twice already: typing a new version_name (e.g. "1.0.7") while
            # leaving version_code at its default of "1", or otherwise below
            # any versionCode Play Console has ever accepted. Play rejects
            # the upload for this — better to fail the build now, loudly,
            # than to discover it after uploading a doomed AAB.
            if ! [[ "$CODE" =~ ^[0-9]+$ ]]; then
              echo "::error::version_code ('$CODE') must be a plain positive integer."
              exit 1
            fi
            PUBSPEC_CODE=$(grep -E '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+)[[:space:]]*$/\1/')
            if [[ -z "$PUBSPEC_CODE" ]] || ! [[ "$PUBSPEC_CODE" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not read a build number (the +N suffix) out of pubspec.yaml's version: line — refusing to guess a safe version_code floor."
              exit 1
            fi
            if (( CODE <= PUBSPEC_CODE )); then
              echo "::error::version_code ($CODE) must be HIGHER than pubspec.yaml's current build number ($PUBSPEC_CODE), which itself must be at or above whatever Play Console last accepted. Use something clearly above $PUBSPEC_CODE — check Play Console's release history if you're unsure how far ahead to jump."
              exit 1
            fi
          fi
          # Filenames get a visible -TEST suffix when unlocked, so the file
          # itself makes it hard to mistake for a Production upload.
          SUFFIX=""
          [[ "$UNLOCK" == "true" ]] && SUFFIX="-TEST"

          echo "name=$NAME"       >> "$GITHUB_OUTPUT"
          echo "code=$CODE"       >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME"       >> "$GITHUB_OUTPUT"
          echo "unlock=$UNLOCK"   >> "$GITHUB_OUTPUT"
          echo "suffix=$SUFFIX"   >> "$GITHUB_OUTPUT"
          if [[ "$UNLOCK" == "true" ]]; then
            echo "::warning::UNLOCK_ALL_FEATURES=true — this build has every paywall bypassed. Upload it ONLY to Closed Testing, never to Production."
          fi

      # ── Production signing (optional) ─────────────────────────────────
      # Store these four secrets in  Settings → Secrets → Actions:
      #   KEYSTORE_BASE64  — base64 of your .jks file
      #                       $ base64 -w0 upload-keystore.jks
      #   STORE_PASSWORD   — keystore password
      #   KEY_ALIAS        — key alias inside the keystore
      #   KEY_PASSWORD     — key password
      #
      # If secrets are absent the APK is signed with the debug key (fine
      # for sideloading and internal testing, NOT for Play Store).
      - name: Set up production signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD:  ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS:       ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:    ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore.jks
            cat > android/key.properties <<EOF
          storeFile=../keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Production signing configured."
          else
            echo "No KEYSTORE_BASE64 secret — APK will use debug signing."
          fi

      # ── Build ─────────────────────────────────────────────────────────
      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.ver.outputs.name }}" \
            --build-number="${{ steps.ver.outputs.code }}" \
            --dart-define="ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL || 'selvavishnu.m@gmail.com' }}" \
            --dart-define="UNLOCK_ALL_FEATURES=${{ steps.ver.outputs.unlock }}"

      # ── Rename APK ────────────────────────────────────────────────────
      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/NoiseClear-${{ steps.ver.outputs.name }}${{ steps.ver.outputs.suffix }}.apk"

      # ── Upload artifact (always available in Actions tab) ─────────────
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoiseClear-${{ steps.ver.outputs.name }}${{ steps.ver.outputs.suffix }}-apk
          path: build/app/outputs/flutter-apk/NoiseClear-*.apk
          retention-days: 90

      # ── Build AAB (Android App Bundle) — THIS is what Play Store needs ─
      # Google Play only accepts .aab uploads. It is signed with the same
      # upload key (key.properties → signingConfigs.release). If the signing
      # secrets are absent it is debug-signed and Play Console will REJECT it,
      # so the four secrets above are mandatory for a real Play Store upload.
      - name: Build release AAB
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.ver.outputs.name }}" \
            --build-number="${{ steps.ver.outputs.code }}" \
            --dart-define="ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL || 'selvavishnu.m@gmail.com' }}" \
            --dart-define="UNLOCK_ALL_FEATURES=${{ steps.ver.outputs.unlock }}"

      # ── Rename AAB ────────────────────────────────────────────────────
      - name: Rename AAB
        run: |
          mv build/app/outputs/bundle/release/app-release.aab \
             "build/app/outputs/bundle/release/NoiseClear-${{ steps.ver.outputs.name }}${{ steps.ver.outputs.suffix }}.aab"

      # ── Upload AAB artifact (download this, upload to Play Console) ────
      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoiseClear-${{ steps.ver.outputs.name }}${{ steps.ver.outputs.suffix }}-aab
          path: build/app/outputs/bundle/release/NoiseClear-*.aab
          retention-days: 90

      # ── Deobfuscation (mapping) file — fixes Play Console's warning ────
      # minifyEnabled true (R8) already produces this at build time; it just
      # was never captured anywhere. Rename + upload it so it can be attached
      # in Play Console: App bundle explorer -> select this version ->
      # Downloads tab -> "Upload deobfuscation file". Optional but recommended
      # so crashes/ANRs show real symbol names instead of a1.b2.c3.
      - name: Rename R8 mapping file
        run: |
          cp build/app/outputs/mapping/release/mapping.txt \
             "build/app/outputs/mapping/release/NoiseClear-${{ steps.ver.outputs.name }}${{ steps.ver.outputs.suffix }}-mapping.txt"

      - name: Upload mapping file artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoiseClear-${{ steps.ver.outputs.name }}${{ steps.ver.outputs.suffix }}-mapping
          path: build/app/outputs/mapping/release/NoiseClear-*-mapping.txt
          retention-days: 90

      # ── GitHub Release (on tag push OR manual dispatch) ───────────────
      # On manual dispatch the tag does not yet exist; action-gh-release
      # creates it at the checked-out commit (target_commitish).
      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name:         ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name:             "NoiseClear ${{ steps.ver.outputs.tag }}${{ steps.ver.outputs.suffix }}"
          body: |
            ## NoiseClear ${{ steps.ver.outputs.tag }}${{ steps.ver.outputs.suffix }}

            ${{ steps.ver.outputs.unlock == 'true' && '> **⚠️ TEST BUILD — every paywall is bypassed, no purchase required.** Upload this .aab ONLY to Play Console → Closed Testing. Never upload it to Production.' || '' }}

            ### Play Store (recommended)
            Upload **NoiseClear-${{ steps.ver.outputs.name }}${{ steps.ver.outputs.suffix }}.aab** to
            Play Console → your app → ${{ steps.ver.outputs.unlock == 'true' && 'Closed testing' || 'Production (or Internal testing)' }} →
            Create new release → upload the `.aab`. Google Play re-signs it
            with App Signing. Version code: **${{ steps.ver.outputs.code }}**
            (must be higher than the previous upload).

            After uploading, clear the "no deobfuscation file" warning:
            App bundle explorer → select this version → Downloads tab →
            Upload deobfuscation file → pick **NoiseClear-${{ steps.ver.outputs.name }}${{ steps.ver.outputs.suffix }}-mapping.txt**
            below. Optional, but makes crash/ANR reports readable.

            ### Sideload / direct install (testing)
            1. Download **NoiseClear-${{ steps.ver.outputs.name }}${{ steps.ver.outputs.suffix }}.apk** below.
            2. On your Android device: **Settings → Apps → Install unknown apps** → allow your browser/file manager.
            3. Open the downloaded APK and tap **Install**.

            Requires Android 7.0+ (minSdk 24).

            ---
            *Full changelog generated from commits since the last release.*
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/NoiseClear-*.apk
            build/app/outputs/bundle/release/NoiseClear-*.aab
            build/app/outputs/mapping/release/NoiseClear-*-mapping.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
